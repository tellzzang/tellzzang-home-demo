  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    .ig-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.25rem 0.9rem 6rem;
    }

    /* Profile Header */
    .ig-profile {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 1.4rem;
      align-items: center;
      padding-bottom: 1.35rem;
      border-bottom: 1px solid var(--border);
    }

    .ig-avatar-ring {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.25s var(--ease-apple);
    }

    .ig-avatar-ring:hover {
      transform: scale(1.04);
    }

    .ig-avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface-solid);
      border: 3px solid var(--bg);
      display: grid;
      place-items: center;
      font-size: 2.2rem;
    }

    .ig-handle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
    }

    .ig-handle {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .ig-verified {
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: #0095f6;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 800;
    }

    .ig-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 1.15rem;
      margin-bottom: 0.55rem;
      font-size: 0.88rem;
    }

    .ig-bio {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.5;
    }

    .ig-bio strong {
      color: var(--text);
    }

    /* Stories Row */
    .ig-stories {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding: 1.15rem 0.15rem;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .ig-stories::-webkit-scrollbar {
      display: none;
    }

    .ig-story-btn {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .story-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      display: grid;
      place-items: center;
      transition: transform 0.2s var(--ease-apple);
    }

    .ig-story-btn:hover .story-ring {
      transform: scale(1.06);
    }

    .story-core {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface-solid);
      border: 2.5px solid var(--bg);
      display: grid;
      place-items: center;
      font-size: 1.45rem;
    }

    /* View Mode Tabs */
    .ig-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.15rem;
    }

    .ig-tab {
      border: none;
      background: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 700;
      padding: 0.85rem 0.25rem;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      text-align: center;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .ig-tab.active {
      color: var(--text);
      border-bottom-color: var(--text);
    }

    /* 1-Column Instagram Timeline Feed (Default!) */
    .ig-stream {
      display: grid;
      gap: 1.5rem;
    }

    .ig-post-card {
      border-radius: 22px;
      border: 1px solid var(--border);
      background: var(--surface-solid);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .ig-post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.05rem;
    }

    .ig-author {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .ig-author-mini {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 1.05rem;
    }

    .ig-post-date {
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .ig-post-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .ig-post-media {
      position: relative;
      aspect-ratio: 4 / 3;
      padding: clamp(1.35rem, 4vw, 2.2rem);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .ig-media-kicker {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
      opacity: 0.85;
    }

    .ig-media-title {
      margin: 0.35rem 0 0.5rem;
      font-size: clamp(1.5rem, 5vw, 2.15rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.03em;
    }

    .ig-media-sub {
      margin: 0;
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      opacity: 0.92;
    }

    .ig-post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem 0.35rem;
    }

    .ig-action-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .ig-act-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      border: none;
      background: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.35rem 0.45rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .ig-act-btn:hover {
      background: var(--bg-alt);
    }

    .ig-act-btn:active {
      transform: scale(1.14);
    }

    .ig-post-body {
      padding: 0.2rem 1.05rem 1.15rem;
    }

    .ig-caption {
      margin: 0 0 0.55rem;
      font-size: 0.94rem;
      line-height: 1.62;
    }

    .ig-tags {
      margin: 0 0 0.9rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--accent);
    }

    .ig-open-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .ig-open-btn:hover {
      border-color: var(--border-strong);
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Optional 3-Column Compact Grid Mode (clean, zero text clipping) */
    .ig-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .ig-tile {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      padding: 0.75rem;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .ig-tile-badge {
      align-self: flex-end;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.42rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
    }

    .ig-tile-title {
      font-size: clamp(0.82rem, 2.4vw, 1.08rem);
      font-weight: 800;
      line-height: 1.25;
      word-break: keep-all;
    }

    .ig-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 20px;
    }

    /* Fullscreen Story Modal */
    .story-modal {
      position: fixed;
      inset: 0;
      z-index: 190;
      background: rgba(0, 0, 0, 0.9);
      display: grid;
      place-items: center;
      padding: 1rem;
    }

    .story-modal[hidden] {
      display: none;
    }

    .story-card {
      width: min(100%, 400px);
      height: min(84vh, 660px);
      border-radius: 26px;
      padding: 1.1rem 1.3rem 1.6rem;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
    }

    .story-progress-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      overflow: hidden;
    }

    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
    }

    @media (max-width: 640px) {
      .ig-profile {
        grid-template-columns: 76px 1fr;
        gap: 1rem;
      }

      .ig-avatar-ring {
        width: 74px;
        height: 74px;
      }

      .ig-avatar-inner {
        font-size: 1.75rem;
      }

      .ig-stats {
        gap: 0.85rem;
        font-size: 0.82rem;
      }
    }
  </style>
</head>

          caption: "기준연도 가격과 당해연도 가격 변화에 따라 실질 GDP와 GDP 디플레이터가 어떻게 움직이는지 직접 숫자를 바꿔 보며 익히는 웹앱입니다.",
          tags: "#GDP디플레이터 #명목GDP #실질GDP",
          likes: 27,
          link: "https://gdp.tellzzang.com",
          cta: "gdp.tellzzang.com 열기 ↗"
        },
        {
          id: "p6",
          date: "11월 23일 예정 · 예고",
          badge: "다음 주",
          gradient: "linear-gradient(135deg, #3a1c71 0%, #d76d77 50%, #ffaf7b 100%)",
          kicker: "COMING NEXT · 04",
          title: "04호 예고: 금리와 환율",
          shortTitle: "금리·환율",
          sub: "11월 23일 월요일 오전 08:30 오픈 예정",
          caption: "한국은행 기준금리 변동이 원/달러 환율, 수입 물가, 수출 기업 채산성에 미치는 연쇄 효과를 시나리오별로 정리한 04호 학습지가 곧 올라옵니다.",
          tags: "#기준금리 #환율변동 #04호예고",
          likes: 19,
          link: "../index.html",
          cta: "전체 학습지 자료실 보기 >"
        }
      ];

      const stories = [
        { emoji: "📢", bg: "linear-gradient(160deg, #0071e3, #111)", title: "이번 주 핵심 공지", body: "다음 수업 [03호] 물가와 실업 학습지를 꼭 챙겨오세요. 수행평가 보고서 초안 마감은 금요일 17:00입니다!", cta: "../ws-03/index.html" },
        { emoji: "📄", bg: "linear-gradient(160deg, #5e5ce6, #111)", title: "03호 실시간 시뮬레이터", body: "슬라이더를 움직여 실망실업자가 실업률에 미치는 착시를 눈으로 직접 확인하세요.", cta: "../ws-03/index.html" },
        { emoji: "📊", bg: "linear-gradient(160deg, #0f766e, #111)", title: "수행평가 배점 포인트", body: "통계 정확성 40% + 그래프 상관관계 해석 40% + 단위(% vs %p) 정확성 20%!", cta: "../report/index.html" },
        { emoji: "🎯", bg: "linear-gradient(160deg, #b45309, #111)", title: "방과 후 15분 클리닉", body: "화·목 16:20~17:20, 2층 사회과 연구실에서 오답 노트를 함께 점검합니다.", cta: "../clinic/index.html" },
        { emoji: "📈", bg: "linear-gradient(160deg, #00c7be, #0a2540)", title: "GDP 인터랙티브 랩", body: "gdp.tellzzang.com 에서 명목·실질 GDP 차이를 직접 조작해 보세요.", cta: "https://gdp.tellzzang.com" }
      ];

      const container = document.getElementById("igFeedContainer");
      const savedSet = new Set(JSON.parse(localStorage.getItem("tellzzang-ig-saved") || "[]"));
      const likedSet = new Set(JSON.parse(localStorage.getItem("tellzzang-ig-liked") || "[]"));
      let currentTab = "feed";

      function toggleLike(id) {
        if (likedSet.has(id)) likedSet.delete(id);
        else likedSet.add(id);
        localStorage.setItem("tellzzang-ig-liked", JSON.stringify([...likedSet]));
        render();
      }

      function toggleSave(id) {
        if (savedSet.has(id)) savedSet.delete(id);
        else savedSet.add(id);
        localStorage.setItem("tellzzang-ig-saved", JSON.stringify([...savedSet]));
        render();
      }

      function render() {
        if (!container) return;
        const list = currentTab === "saved" ? posts.filter((p) => savedSet.has(p.id)) : posts;

        if (currentTab === "grid") {
          const grid = document.createElement("div");
          grid.className = "ig-grid";
          list.forEach((p) => {
            const tile = document.createElement("a");
            tile.className = "ig-tile";
            tile.href = p.link;
            if (p.link.startsWith("http")) {
              tile.target = "_blank";
              tile.rel = "noopener noreferrer";
            }
            tile.style.background = p.gradient;
            tile.innerHTML = `
              <span class="ig-tile-badge">${p.badge}</span>
              <span class="ig-tile-title">${p.shortTitle}</span>
            `;
            grid.appendChild(tile);
          });
          container.replaceChildren(grid);
          return;
        }

        if (list.length === 0) {
          container.innerHTML = `<div class="ig-empty">아직 저장한 게시물이 없습니다.<br />피드 우측 <strong>🔖 저장</strong> 버튼을 눌러 모아보세요!</div>`;
          return;
        }

        const stream = document.createElement("div");
        stream.className = "ig-stream";

        list.forEach((p) => {
          const liked = likedSet.has(p.id);
          const saved = savedSet.has(p.id);
          const likeNum = p.likes + (liked ? 1 : 0);
          const extAttrs = p.link.startsWith("http") ? 'target="_blank" rel="noopener noreferrer"' : "data-transition";

          const card = document.createElement("article");
          card.className = "ig-post-card";
          card.innerHTML = `
            <div class="ig-post-head">
              <div class="ig-author">
                <div class="ig-author-mini">📚</div>
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 0.3rem;">
                    <span>tellzzang.class</span><span class="ig-verified">✓</span>
                  </div>
                  <div class="ig-post-date">${p.date}</div>
                </div>
              </div>
              <span class="ig-post-badge">${p.badge}</span>
            </div>

            <a href="${p.link}" ${extAttrs} class="ig-post-media" style="background: ${p.gradient};">
              <span class="ig-media-kicker">${p.kicker}</span>
              <div>
                <h2 class="ig-media-title">${p.title}</h2>
                <p class="ig-media-sub">${p.sub}</p>
              </div>
            </a>

            <div class="ig-post-actions">
              <div class="ig-action-left">
                <button class="ig-act-btn" type="button" data-like="${p.id}">
                  <span>${liked ? "❤️" : "🤍"}</span><span>${likeNum}</span>
                </button>
                <a class="ig-act-btn" href="${p.link}" ${extAttrs}>
                  <span>💬</span><span>자세히</span>
                </a>
              </div>
              <button class="ig-act-btn" type="button" data-save="${p.id}">
                <span>${saved ? "✅" : "🔖"}</span><span>${saved ? "저장됨" : "저장"}</span>
              </button>
            </div>

            <div class="ig-post-body">
              <p class="ig-caption"><strong>tellzzang.class</strong> ${p.caption}</p>
              <p class="ig-tags">${p.tags}</p>
              <a class="ig-open-btn" href="${p.link}" ${extAttrs}>${p.cta}</a>
            </div>
          `;
          stream.appendChild(card);
        });

        container.replaceChildren(stream);

        container.querySelectorAll("[data-like]").forEach((btn) => {
          btn.addEventListener("click", () => toggleLike(btn.dataset.like));
        });
        container.querySelectorAll("[data-save]").forEach((btn) => {
          btn.addEventListener("click", () => toggleSave(btn.dataset.save));
        });
      }

      document.querySelectorAll("[data-ig-tab]").forEach((tab) => {
        tab.addEventListener("click", () => {
          currentTab = tab.dataset.igTab;
          document.querySelectorAll("[data-ig-tab]").forEach((t) => t.classList.toggle("active", t === tab));
          render();
        });
      });

      // Story Viewer
      const storyModal = document.getElementById("storyModal");
      const storyCard = document.getElementById("storyCard");
      const storyFill = document.getElementById("storyFill");
      let storyTimer = null;

      function openStory(idx) {
        const s = stories[idx] || stories[0];
        storyCard.style.background = s.bg;
        document.getElementById("storyEmoji").textContent = s.emoji;
        document.getElementById("storyTitle").textContent = s.title;
        document.getElementById("storyBody").textContent = s.body;
        document.getElementById("storyCta").href = s.cta;
        storyModal.hidden = false;
        storyFill.style.transition = "none";
        storyFill.style.width = "0%";
        requestAnimationFrame(() => {
          storyFill.style.transition = "width 5s linear";
          storyFill.style.width = "100%";
        });
        clearTimeout(storyTimer);
        storyTimer = setTimeout(() => {
          if (idx + 1 < stories.length) openStory(idx + 1);
          else storyModal.hidden = true;
        }, 5000);
      }

      document.querySelectorAll("[data-story]").forEach((btn) => {
        btn.addEventListener("click", () => openStory(Number(btn.dataset.story)));
      });
      document.getElementById("openMainStory")?.addEventListener("click", () => openStory(0));
      document.getElementById("closeStoryBtn")?.addEventListener("click", () => {
        clearTimeout(storyTimer);
        storyModal.hidden = true;
      });

      render();

      window.addEventListener("notion:synced", (e) => {
        const data = e.detail;
        const callout = (data?.blocks || []).find((b) => b.type === "callout");
        if (callout && callout.text) {
          posts[0].caption = callout.text;
          posts[0].sub = "Notion 실시간 동기화됨";
          render();
        }
        fetch(`https://tellzzang-notion-proxy.tellzzang.workers.dev?pageId=41b97363-7abb-81bc-998b-d56a22c059a2&_t=${Math.floor(Date.now() / 10000)}`)
          .then((r) => (r.ok ? r.json() : null))
          .then((sub) => {
            if (sub?.ok && sub.title) {
              posts[1].title = sub.title;
              posts[1].sub = "Notion 하위 페이지 실시간 연동됨";
              render();
            }
          })
          .catch(() => {});
      });
    })();
  </script>
</body>
</html>
